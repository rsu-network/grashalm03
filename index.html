<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<canvas id="fx" aria-hidden="true"></canvas>

    <p class="bio"><span id="bio"></span><span class="caret">|</span></p>

    <ul class="links" id="links"></ul>

    <p class="foot"><span class="live"></span>grashalm03.top</p>

<audio id="music" loop preload="none"></audio>
<script src="config.js"></script>
<script src="script.js"></script>
