<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grashalm03</title>
<meta name="description" content="Grashalm03 – Profil.">
<meta name="theme-color" content="#040811">
<meta property="og:title" content="Grashalm03">
<meta property="og:description" content="Profil von Grashalm03">
<meta property="og:url" content="https://grashalm03.top">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <i class="dots"></i>
  <i class="beam"></i>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="glow" id="glow"></div>
<div class="grain"></div>
<i class="vignette"></i>
<canvas id="rope" aria-hidden="true"></canvas>
<div class="dot" id="dot"></div>

<!-- Klick zum Betreten -->
<button class="enter" id="enter" type="button">
  <span class="enter-text">Klick zum Betreten</span>
</button>

<main class="stage" id="stage" hidden>
  <!-- Ausweis (hängt links) -->
  <article class="badge" id="badge" aria-label="Ausweis von Grashalm03">
    <div class="clip" aria-hidden="true"><i></i></div>
    <div class="face">
      <div class="slot" aria-hidden="true"></div>

      <header class="head">
        <span class="org">GRASHALM<b>03</b></span>
        <span class="type">ACCESS PASS</span>
      </header>

      <div class="photo">
        <img id="avatar" src="avatar.svg" alt="Avatar von Grashalm03" draggable="false">
        <span class="scan" aria-hidden="true"></span>
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      </div>

      <h2 class="bname" id="badgeName">Grashalm03</h2>
      <p class="role" id="role">Coder &amp; Gamer</p>

      <div class="meta">
        <span><em>ID</em> 0003</span>
        <span><em>LEVEL</em> ∞</span>
        <span><em>VALID</em> 2026</span>
      </div>
      <svg class="barcode" id="barcode" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true"></svg>

      <i class="holo" aria-hidden="true"></i>
    </div>
  </article>

  <!-- Inhalt (rechts) -->
  <section class="panel" id="panel">
    <p class="eyebrow"><span></span>Profil</p>
    <h1 class="title" id="name">Grashalm<b>03</b></h1>
    <p class="bio"><span id="bio"></span><span class="caret">|</span></p>

    <ul class="links" id="links"></ul>

    <p class="foot"><span class="live"></span>grashalm03.top</p>
  </section>

  <p class="hint" id="hint">Zieh am Badge</p>
</main>

<audio id="music" loop preload="none"></audio>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="badge.js"></script>
</body>
</html>
